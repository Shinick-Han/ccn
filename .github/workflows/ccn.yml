name: ccn

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: complexity gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline is a git revision, so the full history is required.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time)

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run ccn
        id: ccn
        uses: ./
        with:
          path: .
          baseline: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          fail-on-new: "true"
          sarif: ccn.sarif
          extra-args: "--no-report"

      - name: Upload SARIF
        if: always() && hashFiles('ccn.sarif') != ''
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: ccn.sarif
