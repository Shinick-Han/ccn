name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Third-party actions are pinned to a full commit SHA with the resolved version
# in a trailing comment. A moved upstream tag therefore cannot change what runs
# in this workflow. Bump the SHA and the comment together.
jobs:
  # Hard gate: nothing is built or published unless fmt, clippy and the test
  # suite pass on the tagged commit. This runs on stable (not the MSRV) because
  # rustfmt/clippy components are most reliable there; the MSRV itself is
  # enforced by a separate CI job on pull requests.
  checks:
    name: checks (fmt, clippy, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release --locked

  linux:
    name: build ccn-linux-x64 (AlmaLinux 8 / glibc 2.28)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Building on ubuntu-latest links against glibc 2.39, which AlmaLinux 8
      # (glibc 2.28) cannot run. Build inside the oldest supported userland
      # instead, then assert the symbol versions before publishing. The full
      # test suite is not repeated here: the `checks` job is the gate and this
      # container only builds with --locked.
      - name: Build in AlmaLinux 8
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 bash -c '
            set -euo pipefail
            dnf install -y --setopt=install_weak_deps=False \
              gcc gcc-c++ make git tar gzip curl ca-certificates binutils
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build --release --locked
          '

      - name: Assert glibc <= 2.28
        run: |
          set -euo pipefail
          binary=target/release/ccn
          test -f "$binary"
          max=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n1)
          echo "highest glibc symbol: ${max:-none}"
          if [[ -z "${max:-}" ]]; then
            echo "::error::could not read GLIBC symbol versions"
            exit 1
          fi
          newest=$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -n1)
          if [[ "$newest" != "GLIBC_2.28" ]]; then
            echo "::error::$binary requires $max, newer than AlmaLinux 8's GLIBC_2.28"
            exit 1
          fi

      - name: Stage asset
        run: |
          set -euo pipefail
          cp target/release/ccn ccn-linux-x64
          chmod +x ccn-linux-x64
          ls -l ccn-linux-x64

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ccn-linux-x64
          generate_release_notes: true

  macos:
    name: build ccn-macos-x64
    needs: checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage asset
        run: |
          set -euo pipefail
          cp target/release/ccn ccn-macos-x64
          chmod +x ccn-macos-x64
          ls -l ccn-macos-x64

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ccn-macos-x64
          generate_release_notes: true

  windows:
    name: build ccn-windows-x64.exe
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/ccn.exe ccn-windows-x64.exe
          ls -l ccn-windows-x64.exe

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ccn-windows-x64.exe
          generate_release_notes: true

  # Runs only after all three assets are published. Downloads the exact bytes
  # that consumers get, hashes them, and attaches SHA256SUMS to the same
  # release. Release notes are already generated by the build jobs and are not
  # regenerated here.
  checksums:
    name: publish SHA256SUMS
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Assets can take a moment to become downloadable after upload.
          for attempt in 1 2 3; do
            if gh release download "$GITHUB_REF_NAME" --pattern 'ccn-*' --dir dist --clobber; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::could not download release assets after 3 attempts"
              exit 1
            fi
            echo "attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          ls -l dist

      - name: Create SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ccn-linux-x64 ccn-macos-x64 ccn-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish SHA256SUMS
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/SHA256SUMS
