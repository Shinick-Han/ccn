[package]
name = "ccn"
version = "0.8.2"
edition = "2021"
license = "MIT"
rust-version = "1.90"
autobins = false
description = "Repository code-health scanner: per-file LOC, per-function CCN, distribution histograms"

[features]
default = ["workbench"]
workbench = [
    "dep:tui-term",
    "dep:portable-pty",
    "dep:vt100",
    "dep:nvim-rs",
    "dep:tokio",
]

[[bin]]
name = "ccn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4.30"
ratatui = "0.29.0"
tui-term = { version = "0.2", optional = true }
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.15", optional = true }
nvim-rs = { version = "0.9.2", features = ["use_tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"], optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = "15"
tree-sitter = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
